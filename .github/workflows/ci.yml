name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Deterministic checks only: lint, typecheck, unit tests, build.
# No provider credentials, no Sanity access, no network-dependent suites.
# Later phases must skip live-provider tests when their environment is absent.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install, not npm ci: the lockfile is authored on Windows, and npm
      # prunes foreign-platform optional binaries (rollup/esbuild native
      # packages) from it (npm/cli#4828). `npm install` restores the
      # Linux-native optional deps while still honoring locked versions.
      - name: Install workspaces
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
