# WazehTerms Cloud Run nonsecret environment (docs/DEPLOYMENT.md §2).
# Secrets are NOT here — they bind via --update-secrets (pinned versions):
#   GEMINI_API_KEY, SANITY_ORGANIZATION_TOKEN, REVIEW_HMAC_SECRET,
#   SANITY_READ_TOKEN. Keep this file free of credential values.
SAMPLE_MODE_ENABLED: "true"
# MT-10 demo-only release (owner decision 2026-10-02): custom upload enabled
# for FICTIONAL, non-sensitive documents only, behind the approved
# "Demo uploads only" notice (gemini-free-demo-v1). Free-tier provider —
# real employment documents stay excluded. Rollback = set "false" + redeploy.
CUSTOM_UPLOAD_ENABLED: "true"
IMAGE_INPUT_ENABLED: "false"
URDU_EXPLANATION_ENABLED: "false"

SANITY_CONTEXT_MCP_URL: "https://api.sanity.io/v1/context/organizations/on41l5b0b/mcp/wazeh-terms-mcp"
SANITY_PROJECT_ID: "8g0kllu0"
SANITY_DATASET: "production"
SANITY_KB_ID: "kbynAP4r8P6m"
GEMINI_MODEL: "gemini-3.5-flash-lite"
REVIEW_HMAC_KEY_ID: "key-1"
# MT-10 demo-scope notice approved by the owner (2026-10-02).
PRIVACY_NOTICE_VERSION: "gemini-free-demo-v1"

# Provisional limits (config defaults) — replace with staging-measured
# values before promotion (plans/phase-14/plan.md deliverable 7).
MAX_BYTES_PER_FILE: "8388608"
MAX_TOTAL_BYTES: "16777216"
MAX_PAGES_PER_PDF: "15"
MAX_CORRECTIONS: "100"
# Staging-measured (2026-09-30): live analysis ≈17.5 s and the default 8 s
# retrieval budget starved KB search + canonical verification from
# asia-south1, so source-backed concerns were withheld. 15 s retrieval
# inside a 45 s deadline keeps the app well below the 120 s platform
# timeout while letting the gate complete.
APPLICATION_DEADLINE_MS: "45000"
RETRIEVAL_TIMEOUT_MS: "15000"

# Admission control (security hardening) — provisional public values.
RATE_LIMIT_MAX: "60"
RATE_LIMIT_WINDOW_MS: "60000"
MAX_CONCURRENT_EXTRACTIONS: "5"
